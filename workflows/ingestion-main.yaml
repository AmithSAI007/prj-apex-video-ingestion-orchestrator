# Workflow triggered by Cloud Storage finalize events to start the pipeline.
main:
  params: [event]
  steps:
    # Collect input metadata and environment configuration.
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - project_region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - video_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - firestore_db: ${sys.get_env("FIRESTORE_DB")}
          - event_type: ${event.type}
          - bucket: ${event.bucket}
          - object: ${event.data.name}
          - input_uri: ${"gs://" + bucket + "/" + object}
          - output_uri: ${"gs://apex-dev-gcs-processed-videos/output/" + video_id + "/"}
          - output_uri_ai: ${"gs://apex-dev-gcs-video-metadata/" + video_id + "/video_analysis.json"}
          - template_id: ${sys.get_env("TRANSCODER_TEMPLATE_ID")}
          - doc_name: ${"projects/" + project_id + "/databases/" + firestore_db + "/documents/videos/" + video_id}
          - current_time: ${time.format(sys.now())}

    # Emit a structured log entry for observability.
    - log_start:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: "Ingestion started"
            video_id: ${video_id}
            file: ${object}

    # Create the initial Firestore document to track workflow state.
    - create_firestore_doc:
        call: googleapis.firestore.v1.projects.databases.documents.patch
        args:
          name: ${doc_name}
          updateMask:
            fieldPaths:
              ["video_id", "original_filename", "status", "created_at"]
          body:
            fields:
              video_id:
                stringValue: ${video_id}
              original_filename:
                stringValue: ${object}
              status:
                stringValue: "PENDING"
              created_at:
                timestampValue: ${current_time}

    # Run transcoding and optional AI analysis in parallel with error handling.
    - process_media_safe:
        try:
          parallel:
            branches:
              - transcode_branch:
                  steps:
                    # Kick off a Transcoder job for the uploaded asset.
                    - start_transcoding:
                        call: googleapis.transcoder.v1.projects.locations.jobs.create
                        args:
                          parent: ${"projects/" + project_id + "/locations/" + project_region}
                          body:
                            inputUri: ${input_uri}
                            outputUri: ${output_uri}
                            templateId: ${template_id}
                            labels:
                              video_id: ${video_id}
                        result: transcoding_result

                    # Log successful job creation.
                    - log_transcoding_success:
                        call: sys.log
                        args:
                          severity: "INFO"
                          json:
                            message: "Transcoding job started successfully"
                            transcoding_job: ${transcoding_result.name}

                    # Persist job metadata and status transition in Firestore.
                    - update_status_processing:
                        call: googleapis.firestore.v1.projects.databases.documents.patch
                        args:
                          name: ${doc_name}
                          updateMask:
                            fieldPaths:
                              ["transcoding_job_id", "status", "updated_at"]
                          body:
                            fields:
                              transcoding_job_id:
                                stringValue: ${transcoding_result.name}
                              status:
                                stringValue: "PROCESSING"
                              updated_at:
                                timestampValue: ${time.format(sys.now())}
              - ai_branch:
                  steps:
                    - start_ai_analysis:
                        try:
                          call: http.post
                          args:
                            url: "https://videointelligence.googleapis.com/v1/videos:annotate"
                            auth:
                              type: OAuth2
                            body:
                              inputUri: ${input_uri}
                              features:
                                [
                                  "LABEL_DETECTION",
                                  "SHOT_CHANGE_DETECTION",
                                  "EXPLICIT_CONTENT_DETECTION",
                                ]
                              outputUri: ${output_uri_ai}
                          result: ai_result
                        except:
                          as: ai_error
                          steps:
                            - log_ai_failure:
                                call: sys.log
                                args:
                                  severity: "ERROR"
                                  json:
                                    message: "AI Analysis failed to start"
                                    error: ${ai_error}
                                    video_id: ${video_id}

                    - log_ai_start:
                        call: sys.log
                        args:
                          severity: "INFO"
                          json:
                            message: "AI Analysis started"
                            video_id: ${video_id}
        except:
          as: e
          steps:
            # Capture and log failures so operators can troubleshoot quickly.
            - log_error:
                call: sys.log
                args:
                  severity: "ERROR"
                  json:
                    message: "Error during media processing"
                    error: ${e}
                    video_id: ${video_id}

            # Mark the Firestore document as failed and attach the error detail.
            - set_failed_status:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: ${doc_name}
                  updateMask:
                    fieldPaths: ["status", "updated_at", "error_message"]
                  body:
                    fields:
                      status:
                        stringValue: "ERROR"
                      updated_at:
                        timestampValue: ${time.format(sys.now())}
                      error_message:
                        stringValue: ${json.encode(e)}
            # Re-raise the error to surface the failure to the caller.
            - fail_execution:
                raise: ${e}
    # Return a succinct success payload to Eventarc.
    - return_result:
        return:
          message: "Event processed successfully"
          status: "success"
