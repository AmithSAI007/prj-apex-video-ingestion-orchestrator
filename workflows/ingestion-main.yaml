main:
  params: [event]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - project_region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - video_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - firestore_db: ${sys.get_env("FIRESTORE_DB")}
          - event_type: ${event.type}
          - bucket: ${event.bucket}
          - object: ${event.data.name}
          - input_uri: ${"gs://" + bucket + "/" + object}
          - output_uri: ${"gs://apex-dev-gcs-processed-videos/output/" + video_id + "/"}
          - template_id: ${sys.get_env("TRANSCODER_TEMPLATE_ID")}
          - doc_name: ${"projects/" + project_id + "/databases/" + firestore_db + "/documents/videos/" + video_id}
          - current_time: ${time.format(sys.now())}

    - log_start:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: "Ingestion started"
            video_id: ${video_id}
            file: ${object}

    - create_firestore_doc:
        call: googleapis.firestore.v1.projects.databases.documents.patch
        args:
          name: ${doc_name}
          updateMask:
            fieldPaths:
              ["video_id", "original_filename", "status", "created_at"]
          body:
            fields:
              video_id:
                stringValue: ${video_id}
              original_filename:
                stringValue: ${object}
              status:
                stringValue: "PENDING"
              created_at:
                timestampValue: ${current_time}

    - process_media_safe:
        try:
          parallel:
            branches:
              - transcode_branch:
                  steps:
                    - start_transcoding:
                        call: googleapis.transcoder.v1.projects.locations.jobs.create
                        args:
                          parent: ${"projects/" + project_id + "/locations/" + project_region}
                          body:
                            inputUri: ${input_uri}
                            outputUri: ${output_uri}
                            templateId: ${template_id}
                            labels:
                              video_id: ${video_id}
                        retry:
                          predicate: ${http.default_retry_predicate}
                          max_retries: 3
                          backoff:
                            initial_delay: 2.0
                            max_delay: 60.0
                            multiplier: 2.0
                        result: transcoding_result

                    - log_transcoding_success:
                        call: sys.log
                        args:
                          severity: "INFO"
                          json:
                            message: "Transcoding job started successfully"
                            transcoding_job: ${transcoding_result.name}

                    - update_status_processing:
                        call: googleapis.firestore.v1.projects.databases.documents.patch
                        args:
                          name: ${doc_name}
                          updateMask:
                            fieldPaths:
                              ["transcoding_job_id", "status", "updated_at"]
                          body:
                            fields:
                              transcoding_job_id:
                                stringValue: ${transcoding_result.name}
                              status:
                                stringValue: "PROCESSING"
                              updated_at:
                                timestampValue: ${time.format(sys.now())}
              - ai_branch:
                  steps:
                    - log_ai_placeholder:
                        call: sys.log
                        args:
                          severity: "NOTICE"
                          json:
                            message: "AI Analysis - To Be Designed"
                            video_id: ${video_id}
                            note: "This branch is reserved for Video Intelligence API integration"
        except:
          as: e
          steps:
            - log_error:
                call: sys.log
                args:
                  severity: "ERROR"
                  json:
                    message: "Error during media processing"
                    error: ${e}
                    video_id: ${video_id}

            - set_failed_status:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: ${doc_name}
                  updateMask:
                    fieldPaths: ["status", "updated_at", "error_message"]
                  body:
                    fields:
                      status:
                        stringValue: "ERROR"
                      updated_at:
                        timestampValue: ${time.format(sys.now())}
                      error_message:
                        stringValue: ${string(e)}
            - fail_execution:
                raise: ${e}
    - return_result:
        return:
          message: "Event processed successfully"
          status: "success"
