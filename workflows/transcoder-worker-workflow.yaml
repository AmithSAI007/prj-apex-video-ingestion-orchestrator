# Workflow triggered by Cloud Tasks to process a video payload.
# Enterprise standards notes:
# - Validate required inputs before calling external APIs.
# - Use structured logs for operational visibility.
# - Persist status updates to Firestore for traceability.
# - Treat Cloud Tasks retries as at-least-once delivery.
main:
  params: [payload]
  steps:
    # Normalize payload to an object (Cloud Tasks may pass JSON as a string).
    - normalize_payload:
        assign:
          - normalized_payload: ${payload}

    - decode_payload_string:
        try:
          steps:
            - decode_payload:
                assign:
                  - normalized_payload: ${json.decode(payload)}
        except:
          as: e
          steps:
            - ignore_decode_error:
                assign:
                  - normalized_payload: ${normalized_payload}

    - decode_payload_argument:
        try:
          steps:
            - decode_argument:
                assign:
                  - normalized_payload: ${json.decode(normalized_payload.argument)}
        except:
          as: e
          steps:
            - ignore_argument_error:
                assign:
                  - normalized_payload: ${normalized_payload}

    - unwrap_argument_object:
        switch:
          - condition: ${"argument" in normalized_payload and normalized_payload.argument != null}
            next: use_argument_object

    - use_argument_object:
        assign:
          - normalized_payload: ${normalized_payload.argument}

    - log_normalized_payload:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: "Normalized payload"
            payload: ${normalized_payload}

    - return_result:
        return:
          message: "Event processed successfully"
          status: "success"
