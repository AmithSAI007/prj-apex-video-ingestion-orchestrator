# Workflow triggered by Cloud Tasks to process a video payload.
# Enterprise standards notes:
# - Validate required inputs before calling external APIs.
# - Use structured logs for operational visibility.
# - Persist status updates to Firestore for traceability.
# - Treat Cloud Tasks retries as at-least-once delivery.
main:
  params: [payload]
  steps:
    - init:
        assign:
          - normalized_payload: ${payload}
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - project_region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - transcoder_template_id: ${normalized_payload.template_id}
          - video_id: ${normalized_payload.video_id}
          - label_video_id: ${text.to_lower(normalized_payload.video_id)}
          - input_uri: ${normalized_payload.input_uri}
          - output_uri: ${normalized_payload.output_uri}
          - ai_output_uri: ${normalized_payload.output_uri_ai}
          - doc_name: ${normalized_payload.doc_name}
          - current_time: ${time.format(sys.now())}

    # Guard against retries or duplicate tasks overwriting terminal statuses.
    - check_existing_status:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.get
          args:
            name: ${doc_name}
          result: existing_doc
        except:
          as: e
          steps:
            - ignore_missing_doc:
                switch:
                  - condition: ${e.code == 404}
                    next: process_media_safe
            - reraise_get_error:
                raise: ${e}

    - skip_if_terminal:
        switch:
          - condition: ${"fields" in existing_doc and "status" in existing_doc.fields and (existing_doc.fields.status.stringValue == "COMPLETED" or existing_doc.fields.status.stringValue == "FAILED" or existing_doc.fields.status.stringValue == "ERROR")}
            next: log_terminal_skip

    # Start transcoding and AI analysis in parallel.
    - process_media_safe:
        try:
          parallel:
            branches:
              - transcode_batch:
                  steps:
                    - start_transcoding:
                        call: googleapis.transcoder.v1.projects.locations.jobs.create
                        args:
                          parent: ${"projects/" + project_id + "/locations/" + project_region}
                          body:
                            inputUri: ${input_uri}
                            outputUri: ${output_uri}
                            templateId: ${transcoder_template_id}
                            labels:
                              video_id: ${label_video_id}
                        result: transcoding_result

                    - log_transcoding_success:
                        call: sys.log
                        args:
                          severity: "INFO"
                          json:
                            message: "Transcoding job started successfully"
                            transcoding_job: ${transcoding_result.name}
                            video_id: ${video_id}

                    - update_transcoding_job_id:
                        call: googleapis.firestore.v1.projects.databases.documents.patch
                        args:
                          name: ${doc_name}
                          updateMask:
                            fieldPaths:
                              ["transcoding_job_id", "updated_at"]
                          body:
                            fields:
                              transcoding_job_id:
                                stringValue: ${transcoding_result.name}
                              updated_at:
                                timestampValue: ${current_time}

                    - refresh_status_before_processing:
                        try:
                          call: googleapis.firestore.v1.projects.databases.documents.get
                          args:
                            name: ${doc_name}
                          result: latest_doc
                        except:
                          as: e
                          steps:
                            - ignore_missing_doc_refresh:
                                switch:
                                  - condition: ${e.code == 404}
                                    next: update_status_processing
                            - reraise_refresh_error:
                                raise: ${e}

                    - skip_processing_if_terminal:
                        switch:
                          - condition: ${"fields" in latest_doc and "status" in latest_doc.fields and (latest_doc.fields.status.stringValue == "COMPLETED" or latest_doc.fields.status.stringValue == "FAILED" or latest_doc.fields.status.stringValue == "ERROR")}
                            next: log_processing_skip

                    - update_status_processing:
                        call: googleapis.firestore.v1.projects.databases.documents.patch
                        args:
                          name: ${doc_name}
                          updateMask:
                            fieldPaths:
                              ["status", "updated_at"]
                          body:
                            fields:
                              status:
                                stringValue: "PROCESSING"
                              updated_at:
                                timestampValue: ${current_time}

                    - log_processing_skip:
                        call: sys.log
                        args:
                          severity: "INFO"
                          json:
                            message: "Skipping PROCESSING status update due to terminal status"
                            video_id: ${video_id}
                            status: ${latest_doc.fields.status.stringValue}
              - ai_analysis_batch:
                  steps:
                    - start_ai_analysis:
                        try:
                          call: http.post
                          args:
                            url: "https://videointelligence.googleapis.com/v1/videos:annotate"
                            auth:
                              type: OAuth2
                            body:
                              inputUri: ${input_uri}
                              features:
                                [
                                  "LABEL_DETECTION",
                                  "SHOT_CHANGE_DETECTION",
                                  "EXPLICIT_CONTENT_DETECTION",
                                ]
                              outputUri: ${ai_output_uri}
                          result: ai_result
                          steps:
                            - log_ai_start:
                                call: sys.log
                                args:
                                  severity: "INFO"
                                  json:
                                    message: "AI Analysis started"
                                    video_id: ${video_id}
                        except:
                          as: ai_error
                          steps:
                            - log_ai_failure:
                                call: sys.log
                                args:
                                  severity: "ERROR"
                                  json:
                                    message: "AI Analysis failed to start"
                                    error: ${ai_error}
                                    video_id: ${video_id}
        except:
          as: e
          steps:
            # Capture and log failures so operators can troubleshoot quickly.
            - log_error:
                call: sys.log
                args:
                  severity: "ERROR"
                  json:
                    message: "Error during media processing"
                    error: ${e}
                    video_id: ${video_id}

            - set_failed_status:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: ${doc_name}
                  updateMask:
                    fieldPaths: ["status", "updated_at", "error_message"]
                  body:
                    fields:
                      status:
                        stringValue: "ERROR"
                      updated_at:
                        timestampValue: ${current_time}
                      error_message:
                        stringValue: ${default(e.message, "Unknown error")}
            # Re-raise the error to surface the failure to the caller.
            - fail_execution:
                raise: ${e}

    - return_result:
        return:
          message: "Event processed successfully"
          status: "success"

    - log_terminal_skip:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: "Skipping worker execution due to terminal status"
            video_id: ${video_id}
            status: ${existing_doc.fields.status.stringValue}
        next: return_result
