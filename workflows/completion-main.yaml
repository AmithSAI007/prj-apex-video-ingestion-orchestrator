main:
  params: [event]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - project_region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - firestore_db: ${sys.get_env("FIRESTORE_DB")}
          - pubsub_message_bytes: ${base64.decode(event.data.message.data)}
          - raw_payload: ${json.decode(text.decode(pubsub_message_bytes))}
          - state: ${raw_payload.job.state}
          - job_name: ${raw_payload.job.name}
          - current_time: ${time.format(sys.now())}

    - get_job_details:
        call: googleapis.transcoder.v1.projects.locations.jobs.get
        args:
          name: ${job_name}
        result: full_job

    - extract_metadata:
        assign:
          - video_id: ${full_job.labels.video_id}
          - doc_name: ${"projects/" + project_id + "/databases/(default)/documents/videos/" + video_id}
          - video_stream: ${full_job.config.elementaryStreams[0].videoStream}
          - codec_settings: ${default(video_stream.h264, default(video_stream.h265, video_stream.vp9))}
          - width: ${int(default(codec_settings.widthPixels, 0))}
          - height: ${int(default(codec_settings.heightPixels, 0))}
          - doc_name: ${"projects/" + project_id + "/databases/" + firestore_db + "/documents/videos/" + video_id}

    - log_completion:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: "Transcoding job completed"
            video_id: ${video_id}
            job_name: ${job_name}
            state: ${state}
            raw_payload.job: ${raw_payload.job}

    - check_status:
        switch:
          - condition: ${state == "SUCCEEDED"}
            next: handle_success
          - condition: ${state == "FAILED"}
            next: handle_failure
        next: handle_unknown

    - handle_success:
        call: googleapis.firestore.v1.projects.databases.documents.patch
        args:
          name: ${doc_name}
          updateMask:
            fieldPaths:
              - "status"
              - "updated_at"
              - "width"
              - "height"
          body:
            fields:
              status:
                stringValue: "COMPLETED"
              updated_at:
                timestampValue: ${current_time}
              width:
                integerValue: ${width}
              height:
                integerValue: ${height}
        next: return_success

    - handle_failure:
        call: googleapis.firestore.v1.projects.databases.documents.patch
        args:
          name: ${doc_name}
          updateMask:
            fieldPaths:
              - "status"
              - "updated_at"
          body:
            fields:
              status:
                stringValue: "FAILED"
              updated_at:
                timestampValue: ${current_time}
        next: return_failure

    - handle_unknown:
        call: sys.log
        args:
          severity: "WARNING"
          json:
            message: "Received unknown job state"
            video_id: ${video_id}
            job_name: ${job_name}
            state: ${state}
        next: return_unknown

    - return_success:
        return: "Video Completed"
    - return_failure:
        return: "Video Failed"
    - return_unknown:
        return: "Unknown State"
