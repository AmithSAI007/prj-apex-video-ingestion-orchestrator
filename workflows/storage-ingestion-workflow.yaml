# Workflow triggered by Cloud Storage finalize events to start the pipeline.
# Enterprise standards notes:
# - Keep all environment-dependent values in sys.get_env to avoid hardcoding.
# - Use structured logging (json payloads) for observability and auditability.
# - Ensure Firestore writes are idempotent and recoverable from retries.
# - Favor explicit error handling for external API calls.
# - Maintain stable workflow identifiers across deployments.
main:
  params: [event]
  steps:
    # Collect input metadata and environment configuration.
    # Normalize identifiers derived from hashes to be URL- and document-safe.
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - project_region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - raw_hash: ${default(event.data.md5Hash, sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID"))}
          - video_id: ${text.replace_all(text.replace_all(text.replace_all(raw_hash, "/", "_"), "+", "-"), "=", "")}
          - firestore_db: ${sys.get_env("FIRESTORE_DB")}
          - event_type: ${event.type}
          - bucket: ${event.bucket}
          - object: ${event.data.name}
          - input_uri: ${"gs://" + bucket + "/" + object}
          - output_uri: ${"gs://apex-dev-gcs-processed-videos/output/" + video_id + "/"}
          - output_uri_ai: ${"gs://apex-dev-gcs-video-metadata/" + video_id + "/video_analysis.json"}
          - template_id: ${sys.get_env("TRANSCODER_TEMPLATE_ID")}
          - doc_name: ${"projects/" + project_id + "/databases/" + firestore_db + "/documents/videos/" + video_id}
          - current_time: ${time.format(sys.now())}

    # Emit a structured log entry for observability and traceability.
    - log_start:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: "Ingestion started"
            video_id: ${video_id}
            file: ${object}
            event_type: ${event_type}

    # Create the initial Firestore document to track workflow state.
    # Use create to enforce uniqueness and avoid race conditions.
    - create_firestore_doc:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.createDocument
          args:
            parent: ${"projects/" + project_id + "/databases/" + firestore_db + "/documents"}
            collectionId: "videos"
            documentId: ${video_id}
            mask:
              fieldPaths: ["video_id", "original_filename", "status", "created_at"]
            body:
              fields:
                video_id:
                  stringValue: ${video_id}
                original_filename:
                  stringValue: ${object}
                status:
                  stringValue: "PENDING"
                created_at:
                  timestampValue: ${current_time}
        except:
          as: e
          steps:
            - handle_duplicate_create:
                switch:
                  - condition: ${e.code == 409}
                    next: return_duplicate
            - reraise_create_error:
                raise: ${e}

    # Prepare the worker execution payload for Cloud Tasks.
    # Encode JSON as base64 to satisfy Cloud Tasks HTTP body requirements.
    - prepare_payload:
        assign:
          - worker_workflow_id: "prj-apex-transcoder-worker-workflow"
          - queue_id: "apex-transcoder-tasks-queue"
          - worker_args:
              video_id: ${video_id}
              input_uri: ${input_uri}
              output_uri: ${output_uri}
              output_uri_ai: ${output_uri_ai}
              template_id: ${template_id}
              doc_name: ${doc_name}
          - api_body:
              argument: ${text.decode(json.encode(worker_args))}
          - task_body_base64: ${base64.encode(json.encode(api_body))}
          - worker_url: ${"https://workflowexecutions.googleapis.com/v1/projects/" + project_id + "/locations/" + project_region + "/workflows/" + worker_workflow_id + "/executions"}
          - queue_path: ${"projects/" + project_id + "/locations/" + project_region + "/queues/" + queue_id}

    # Enqueue a task to trigger the worker workflow with service account auth.
    # Cloud Tasks provides retry semantics; ensure the downstream worker is idempotent.
    - create_task:
        call: googleapis.cloudtasks.v2.projects.locations.queues.tasks.create
        args:
          parent: ${queue_path}
          body:
            task:
              httpRequest:
                httpMethod: "POST"
                url: ${worker_url}
                headers:
                  Content-Type: "application/json"
                body: ${task_body_base64}
                oauthToken:
                  serviceAccountEmail: ${sys.get_env("SERVICE_ACCOUNT_EMAIL")}

    # Return a succinct success payload to Eventarc.
    - return_result:
        return:
          message: "Event processed successfully"
          status: "success"

    # Return a consistent skip response for duplicate events.
    - return_duplicate:
        return:
          message: "Video already processed or in progress. Skipping."
          status: "skipped"
          video_id: ${video_id}
